name: Solarized Light

colors:
  primary:    "#1B6CA8"   # darkened Solarized blue — 5.3:1 with white
  accent:     "#1B6CA8"   # same — 4.8:1 on cream bg
  background: "#FDF6E3"
  text:       "#657B83"
  title_text: "#FFFFFF"
  section_bg: "#EEE8D5"
  code_bg:    "#EEE8D5"
  chart_colors:
    - "#268BD2"  # blue
    - "#2AA198"  # cyan
    - "#859900"  # green
    - "#B58900"  # yellow
    - "#CB4B16"  # orange
    - "#DC322F"  # red
    - "#D33682"  # magenta
    - "#6C71C4"  # violet

fonts:
  title: "'Inter', 'Helvetica Neue', Arial, sans-serif"
  body:  "'Inter', 'Helvetica Neue', Arial, sans-serif"
  code:  "'JetBrains Mono', 'Fira Code', monospace"

layout:
  title_align:   left
  heading_align: left
  decoration:    bar-left

footer:
  show:              false
  text:              "{title} — {slide_number} / {total}"
  show_slide_number: true

header:
  show: true
  text: ""
