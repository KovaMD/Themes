name: Kanagawa Lotus

colors:
  primary:    "#624C83"   # lotusViolet4 — 7.3:1 with white
  accent:     "#624C83"   # same — 6.1:1 on cream bg
  background: "#F2ECBC"   # lotusWhite3
  text:       "#545464"   # lotusInk1 — 6.2:1 on bg
  title_text: "#ffffff"
  section_bg: "#E5DDB0"   # lotusWhite2
  code_bg:    "#1f1f28"   # lotusGray
  chart_colors:
    - "#4D699B"  # lotusBlue4
    - "#6F894E"  # lotusGreen
    - "#CC6D00"  # lotusOrange
    - "#624C83"  # lotusViolet4
    - "#B35B79"  # lotusPink
    - "#597B75"  # lotusAqua
    - "#C84053"  # lotusRed
    - "#77713F"  # lotusYellow

fonts:
  title: "'Inter', 'Helvetica Neue', Arial, sans-serif"
  body:  "'Inter', 'Helvetica Neue', Arial, sans-serif"
  code:  "'JetBrains Mono', 'Fira Code', monospace"

layout:
  title_align:   left
  heading_align: left
  decoration:    bar-left

footer:
  show:              false
  text:              "{title} — {slide_number} / {total}"
  show_slide_number: true

header:
  show: true
  text: ""
