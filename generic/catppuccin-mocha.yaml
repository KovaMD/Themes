name: Catppuccin Mocha

colors:
  primary:    "#313244"   # Catppuccin Surface0 — 12.2:1 with white
  accent:     "#CBA6F7"   # Catppuccin Mauve — 8.4:1 on bg
  background: "#1E1E2E"
  text:       "#CDD6F4"
  title_text: "#FFFFFF"
  section_bg: "#313244"
  code_bg:    "#181825"
  chart_colors:
    - "#CBA6F7"  # mauve
    - "#89B4FA"  # blue
    - "#94E2D5"  # teal
    - "#A6E3A1"  # green
    - "#F9E2AF"  # yellow
    - "#FAB387"  # peach
    - "#F38BA8"  # red
    - "#F5C2E7"  # pink

fonts:
  title: "'Inter', 'Helvetica Neue', Arial, sans-serif"
  body:  "'Inter', 'Helvetica Neue', Arial, sans-serif"
  code:  "'JetBrains Mono', 'Fira Code', monospace"

layout:
  title_align:   left
  heading_align: left
  decoration:    bar-left

footer:
  show:              false
  text:              "{title} — {slide_number} / {total}"
  show_slide_number: true

header:
  show: true
  text: ""
