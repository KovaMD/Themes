name: Gruvbox Dark

colors:
  primary:    "#3C3836"   # Gruvbox bg1 — 11.5:1 with white
  accent:     "#FE8019"   # Gruvbox bright orange — 5.9:1 on bg
  background: "#282828"
  text:       "#EBDBB2"
  title_text: "#FFFFFF"
  section_bg: "#3C3836"
  code_bg:    "#1D2021"
  chart_colors:
    - "#FE8019"  # bright orange
    - "#FABD2F"  # bright yellow
    - "#B8BB26"  # bright green
    - "#8EC07C"  # bright aqua
    - "#83A598"  # bright blue
    - "#D3869B"  # bright purple
    - "#FB4934"  # bright red

fonts:
  title: "'Inter', 'Helvetica Neue', Arial, sans-serif"
  body:  "'Inter', 'Helvetica Neue', Arial, sans-serif"
  code:  "'JetBrains Mono', 'Fira Code', monospace"

layout:
  title_align:   left
  heading_align: left
  decoration:    bar-left

footer:
  show:              false
  text:              "{title} — {slide_number} / {total}"
  show_slide_number: true

header:
  show: true
  text: ""
