name: Catppuccin Latte

colors:
  primary:    "#8839EF"   # Catppuccin Mauve — 5.2:1 with white
  accent:     "#8839EF"   # same — 4.7:1 on light bg
  background: "#EFF1F5"
  text:       "#4C4F69"
  title_text: "#FFFFFF"
  section_bg: "#E6E9EF"
  code_bg:    "#303446"
  chart_colors:
    - "#8839EF"  # mauve
    - "#1E66F5"  # blue
    - "#179299"  # teal
    - "#40A02B"  # green
    - "#DF8E1D"  # yellow
    - "#FE640B"  # peach
    - "#D20F39"  # red
    - "#EA76CB"  # pink

fonts:
  title: "'Inter', 'Helvetica Neue', Arial, sans-serif"
  body:  "'Inter', 'Helvetica Neue', Arial, sans-serif"
  code:  "'JetBrains Mono', 'Fira Code', monospace"

layout:
  title_align:   left
  heading_align: left
  decoration:    bar-left

footer:
  show:              false
  text:              "{title} — {slide_number} / {total}"
  show_slide_number: true

header:
  show: true
  text: ""
