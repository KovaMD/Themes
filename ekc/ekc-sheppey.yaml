name: Sheppey

colors:
  primary:    "#A84D00"   # dark burnt orange — 5.6:1 contrast with white
  accent:     "#C45900"   # mid orange — accessible on white
  background: "#ffffff"
  text:       "#1a1a1a"
  title_text: "#ffffff"
  section_bg: "#FDEBD4"
  code_bg:    "#1a1a2e"
  chart_colors:
    - "#A84D00"  # brand dark orange
    - "#C45900"  # brand mid orange
    - "#E8A000"  # amber
    - "#1B6CA8"  # blue (complement)
    - "#0D9488"  # teal
    - "#22C55E"  # green
    - "#7C3AED"  # purple
    - "#EF4444"  # red

fonts:
  title: "Montserrat, 'Inter', 'Helvetica Neue', Arial, sans-serif"
  body:  "Montserrat, 'Inter', 'Helvetica Neue', Arial, sans-serif"
  code:  "'JetBrains Mono', 'Fira Code', monospace"

bundledFonts:
  - Montserrat

layout:
  title_align:   left
  heading_align: left
  decoration:    bar-left

footer:
  show:              false
  text:              "{title} — {slide_number} / {total}"
  show_slide_number: true

header:
  show: true
  text: ""
