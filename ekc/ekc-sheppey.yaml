  background: "#ffffff"
  text:       "#1a1a1a"
  title_text: "#ffffff"
  section_bg: "#FDEBD4"
  code_bg:    "#F5F7FA"

fonts:
  title: "Montserrat, 'Inter', 'Helvetica Neue', Arial, sans-serif"
