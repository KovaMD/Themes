  accent:     "#3A7D29"   # brand green (#4FA938) is marginal on white
  background: "#ffffff"
  text:       "#1a1a1a"
  title_text: "#ffffff"
  section_bg: "#DFF0D8"
  code_bg:    "#F5F7FA"

fonts:
  title: "Montserrat, 'Inter', 'Helvetica Neue', Arial, sans-serif"
  body:  "Montserrat, 'Inter', 'Helvetica Neue', Arial, sans-serif"
  code:  "'JetBrains Mono', 'Fira Code', monospace"

layout:
  title_align:   left
  heading_align: left
  decoration:    bar-left

footer:
  show:              false
  text:              "{title} — {slide_number} / {total}"
