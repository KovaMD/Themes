name: EKC Dover

colors:
  primary:    "#3A7D29"   # darkened green — 5:1 contrast with white
  accent:     "#3A7D29"   # brand green (#4FA938) is marginal on white
  background: "#ffffff"
  text:       "#1a1a1a"
  title_text: "#ffffff"
  section_bg: "#DFF0D8"
  code_bg:    "#F5F7FA"
  chart_colors:
    - "#3A7D29"  # brand green
    - "#4FA938"  # brand light green
    - "#0076AB"  # blue (complement)
    - "#0D9488"  # teal
    - "#EAB308"  # yellow
    - "#F97316"  # orange
    - "#7C3AED"  # purple (complement)
    - "#EF4444"  # red

fonts:
  title: "Montserrat, 'Inter', 'Helvetica Neue', Arial, sans-serif"
  body:  "Montserrat, 'Inter', 'Helvetica Neue', Arial, sans-serif"
  code:  "'JetBrains Mono', 'Fira Code', monospace"

layout:
  title_align:   left
  heading_align: left
  decoration:    bar-left

footer:
  show:              false
  text:              "{title} — {slide_number} / {total}"
  show_slide_number: true

header:
  show: true
  text: ""
