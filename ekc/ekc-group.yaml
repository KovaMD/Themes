name: East Kent

colors:
  primary:    "#00857E"   # darkened teal — white text 5:1 contrast
  accent:     "#00857E"   # brand teal (#00B6AE) is too light for links on white
  background: "#ffffff"
  text:       "#1a1a1a"
  title_text: "#ffffff"
  section_bg: "#D9F3F1"
  code_bg:    "#1a1a2e"
  chart_colors:
    - "#00857E"  # brand teal
    - "#00B6AE"  # brand light teal
    - "#EF4444"  # red (complement)
    - "#F97316"  # orange
    - "#EAB308"  # yellow
    - "#3B82F6"  # blue
    - "#7C3AED"  # purple
    - "#22C55E"  # green

fonts:
  title: "Montserrat, 'Inter', 'Helvetica Neue', Arial, sans-serif"
  body:  "Montserrat, 'Inter', 'Helvetica Neue', Arial, sans-serif"
  code:  "'JetBrains Mono', 'Fira Code', monospace"

layout:
  title_align:   left
  heading_align: left
  decoration:    bar-left

footer:
  show:              false
  text:              "{title} — {slide_number} / {total}"
  show_slide_number: true

header:
  show: true
  text: ""
