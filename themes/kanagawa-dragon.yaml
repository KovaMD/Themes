name: Kanagawa Dragon

colors:
  primary:    "#282727"   # dragonBlack4 — 14.9:1 with white
  accent:     "#8BA4B0"   # dragonBlue2 — 6.9:1 on dark bg
  background: "#181616"   # dragonBlack3
  text:       "#C5C9C5"   # dragonWhite — 10.8:1 on bg
  title_text: "#ffffff"
  section_bg: "#282727"   # dragonBlack4
  code_bg:    "#0D0C0C"   # dragonBlack0
  chart_colors:
    - "#8BA4B0"  # dragonBlue2
    - "#87A987"  # dragonGreen
    - "#C4B28A"  # dragonYellow
    - "#8992A7"  # dragonViolet
    - "#B6927B"  # dragonOrange
    - "#A292A3"  # dragonPink
    - "#8EA4A2"  # dragonAqua
    - "#C4746E"  # dragonRed

fonts:
  title: "'Inter', 'Helvetica Neue', Arial, sans-serif"
  body:  "'Inter', 'Helvetica Neue', Arial, sans-serif"
  code:  "'JetBrains Mono', 'Fira Code', monospace"

layout:
  title_align:   left
  heading_align: left
  decoration:    bar-left

footer:
  show:              false
  text:              "{title}"
  show_slide_number: true

header:
  show: true
  text: ""
