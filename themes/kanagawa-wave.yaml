name: Kanagawa Wave

colors:
  primary:    "#223249"   # waveBlue1 — 13:1 with white
  accent:     "#7E9CD8"   # crystalBlue — 5.9:1 on dark bg
  background: "#1F1F28"   # sumiInk3
  text:       "#DCD7BA"   # fujiWhite — 11.3:1 on bg
  title_text: "#ffffff"
  section_bg: "#2A2A37"   # sumiInk4
  code_bg:    "#16161D"   # sumiInk0
  chart_colors:
    - "#7E9CD8"  # crystalBlue
    - "#98BB6C"  # springGreen
    - "#E6C384"  # carpYellow
    - "#957FB8"  # oniViolet
    - "#FFA066"  # surimiOrange
    - "#D27E99"  # sakuraPink
    - "#7AA89F"  # waveAqua2
    - "#FF5D62"  # peachRed

fonts:
  title: "'Inter', 'Helvetica Neue', Arial, sans-serif"
  body:  "'Inter', 'Helvetica Neue', Arial, sans-serif"
  code:  "'JetBrains Mono', 'Fira Code', monospace"

layout:
  title_align:   left
  heading_align: left
  decoration:    bar-left

footer:
  show:              false
  text:              "{title}"
  show_slide_number: true

header:
  show: true
  text: ""
