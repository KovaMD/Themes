name: One Dark

colors:
  primary:    "#21252B"   # deeper sidebar bg — 15:1 with white
  accent:     "#61AFEF"   # One Dark blue — 6.2:1 on bg
  background: "#282C34"
  text:       "#ABB2BF"
  title_text: "#FFFFFF"
  section_bg: "#2C313C"
  code_bg:    "#21252B"
  chart_colors:
    - "#61AFEF"  # blue
    - "#98C379"  # green
    - "#56B6C2"  # cyan
    - "#C678DD"  # purple
    - "#E06C75"  # red
    - "#D19A66"  # orange
    - "#E5C07B"  # yellow

fonts:
  title: "'Inter', 'Helvetica Neue', Arial, sans-serif"
  body:  "'Inter', 'Helvetica Neue', Arial, sans-serif"
  code:  "'JetBrains Mono', 'Fira Code', monospace"

layout:
  title_align:   left
  heading_align: left
  decoration:    bar-left

footer:
  show:              false
  text:              "{title}"
  show_slide_number: true

header:
  show: true
  text: ""
