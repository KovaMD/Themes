name: Ashford

colors:
  primary:    "#144C99"   # brand navy — 8:1 contrast with white
  accent:     "#144C99"
  background: "#ffffff"
  text:       "#1a1a1a"
  title_text: "#ffffff"
  section_bg: "#DCE4F0"
  code_bg:    "#F5F7FA"
  chart_colors:
    - "#144C99"  # brand navy
    - "#1A80CC"  # mid blue
    - "#00ACC1"  # cyan
    - "#00897B"  # teal
    - "#F4511E"  # orange (complement)
    - "#7B1FA2"  # purple
    - "#E53935"  # red
    - "#43A047"  # green

fonts:
  title: "Montserrat, 'Inter', 'Helvetica Neue', Arial, sans-serif"
  body:  "Montserrat, 'Inter', 'Helvetica Neue', Arial, sans-serif"
  code:  "'JetBrains Mono', 'Fira Code', monospace"

layout:
  title_align:   left
  heading_align: left
  decoration:    bar-left

footer:
  show:              false
  text:              "{title} — {slide_number} / {total}"
  show_slide_number: true

header:
  show: true
  text: ""
