name: Folkestone

colors:
  primary:    "#5D5094"   # darkened purple — 5.5:1 contrast with white
  accent:     "#7669B1"   # brand purple — 4.5:1 on white
  background: "#ffffff"
  text:       "#1a1a1a"
  title_text: "#ffffff"
  section_bg: "#ECEAF6"
  code_bg:    "#F5F7FA"
  chart_colors:
    - "#5D5094"  # brand primary
    - "#7669B1"  # brand accent
    - "#EAB308"  # yellow (complement)
    - "#22C55E"  # green
    - "#0076AB"  # blue
    - "#F97316"  # orange
    - "#EF4444"  # red
    - "#0D9488"  # teal

fonts:
  title: "Montserrat, 'Inter', 'Helvetica Neue', Arial, sans-serif"
  body:  "Montserrat, 'Inter', 'Helvetica Neue', Arial, sans-serif"
  code:  "'JetBrains Mono', 'Fira Code', monospace"

layout:
  title_align:   left
  heading_align: left
  decoration:    bar-left

footer:
  show:              false
  text:              "{title} — {slide_number} / {total}"
  show_slide_number: true

header:
  show: true
  text: ""
