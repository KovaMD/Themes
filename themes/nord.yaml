name: Nord

colors:
  primary:    "#4C6FA5"   # darkened frost blue — 5.3:1 with white
  accent:     "#88C0D0"   # Nord frost light — 6.2:1 on dark bg
  background: "#2E3440"
  text:       "#D8DEE9"
  title_text: "#ECEFF4"
  section_bg: "#3B4252"
  code_bg:    "#434C5E"
  chart_colors:
    - "#88C0D0"  # frost light
    - "#81A1C1"  # frost mid
    - "#A3BE8C"  # aurora green
    - "#EBCB8B"  # aurora yellow
    - "#D08770"  # aurora orange
    - "#BF616A"  # aurora red
    - "#B48EAD"  # aurora purple
    - "#5E81AC"  # frost dark

fonts:
  title: "'Inter', 'Helvetica Neue', Arial, sans-serif"
  body:  "'Inter', 'Helvetica Neue', Arial, sans-serif"
  code:  "'JetBrains Mono', 'Fira Code', monospace"

layout:
  title_align:   left
  heading_align: left
  decoration:    bar-left

footer:
  show:              false
  text:              "{title}"
  show_slide_number: true

header:
  show: true
  text: ""
