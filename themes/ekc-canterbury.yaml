name: Canterbury

colors:
  primary:    "#0076AB"   # darkened sky blue — 5:1 contrast with white
  accent:     "#0076AB"   # brand cyan (#00A0E4) is too light for links on white
  background: "#ffffff"
  text:       "#1a1a1a"
  title_text: "#ffffff"
  section_bg: "#D9EFF9"
  code_bg:    "#F5F7FA"
  chart_colors:
    - "#0076AB"  # brand blue
    - "#00A0E4"  # brand light blue
    - "#0D9488"  # teal
    - "#22C55E"  # green
    - "#EAB308"  # yellow
    - "#F97316"  # orange
    - "#EF4444"  # red
    - "#7C3AED"  # violet

fonts:
  title: "Montserrat, 'Inter', 'Helvetica Neue', Arial, sans-serif"
  body:  "Montserrat, 'Inter', 'Helvetica Neue', Arial, sans-serif"
  code:  "'JetBrains Mono', 'Fira Code', monospace"

layout:
  title_align:   left
  heading_align: left
  decoration:    bar-left

footer:
  show:              false
  text:              "{title} — {slide_number} / {total}"
  show_slide_number: true

header:
  show: true
  text: ""
