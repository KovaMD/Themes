name: Dracula

colors:
  primary:    "#44475A"   # Dracula selection/current line — 8.8:1 with white
  accent:     "#BD93F9"   # Dracula purple — 6.1:1 on bg
  background: "#282A36"
  text:       "#F8F8F2"
  title_text: "#FFFFFF"
  section_bg: "#44475A"
  code_bg:    "#21222C"
  chart_colors:
    - "#BD93F9"  # purple
    - "#8BE9FD"  # cyan
    - "#50FA7B"  # green
    - "#F1FA8C"  # yellow
    - "#FFB86C"  # orange
    - "#FF5555"  # red
    - "#FF79C6"  # pink
    - "#6272A4"  # blue

fonts:
  title: "'Inter', 'Helvetica Neue', Arial, sans-serif"
  body:  "'Inter', 'Helvetica Neue', Arial, sans-serif"
  code:  "'JetBrains Mono', 'Fira Code', monospace"

layout:
  title_align:   left
  heading_align: left
  decoration:    bar-left

footer:
  show:              false
  text:              "{title}"
  show_slide_number: true

header:
  show: true
  text: ""
